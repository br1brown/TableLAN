<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableLAN — Sessione</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="assets/rpg-icons.css">
<link rel="stylesheet" href="assets/console.css">
<style>
  main.session { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1.25rem; align-items: start; }
  @media (max-width: 900px) { main.session { grid-template-columns: minmax(0, 1fr); } }

  .initiative-panel { background: var(--surface); border-radius: var(--radius-lg); padding: var(--pad-card); margin-top: 1.25rem; }
  .init-list { display: flex; flex-direction: column; gap: .4rem; margin-top: .5rem; }
  /* Due punti d'ingresso: l'icona dice da dove viene la roba senza una parola. */
  .init-add { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .7rem; }
  .init-add-row { display: flex; align-items: center; gap: .5rem; }
  .init-add-row > .ra { color: var(--text-muted); width: 1.1rem; text-align: center; flex: none; }
  .init-add-row select { flex: 1; min-width: 0; }
  .init-add-row select:disabled { opacity: .5; }
  /* Il numero è stretto: ci vanno due cifre, non un romanzo. */
  .init-num { width: 3.6rem; flex: none; text-align: center; font-variant-numeric: tabular-nums; }

  .init-row { display: flex; align-items: center; gap: .6rem; padding: .4rem .6rem; background: var(--surface-2); border-radius: var(--radius-sm); border-left: 3px solid transparent; }
  .init-row.active { border-left-color: var(--gold); background: rgba(230,175,46,0.1); }
  /* Le bestie si distinguono a colpo d'occhio dai PG: nel giro sono mescolate
     per forza (è una lista sola), ma l'occhio deve poterle separare. */
  .init-row.npc .init-score { color: var(--hp-text); }
  .init-score { min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--gold); }
  .init-name { flex: 1; min-width: 0; }
  .init-controls { margin-top: 1rem; display: flex; gap: .5rem; }

  /* A mostrarsi e nascondersi è l'overlay, che ha il display inline: qui un
     "display: none" restava acceso per sempre — nessuno lo spegneva — e il QR
     non compariva mai. Si apriva il velo nero su una scatola invisibile, con
     dentro il PNG scaricato e disegnato a zero per zero. */
  .qr-modal { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface); padding: 2rem; border-radius: var(--radius-lg); text-align: center; }
  .qr-modal img { width: 250px; height: 250px; background: #fff; padding: 10px; border-radius: var(--radius); margin-bottom: 1rem; }
  .join-url { font-family: ui-monospace, Consolas, monospace; font-size: 1.2rem; color: var(--gold); }
  @media (max-width: 560px) { .join { flex-direction: column; align-items: flex-start; } }

  .pgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .6rem; }
  .pg { background: var(--surface); border-radius: var(--radius); padding: .7rem .8rem; cursor: pointer; transition: transform var(--tap), filter var(--tap); }
  .pg:hover { filter: brightness(1.15); transform: translateY(-2px); }
  .pg-name { font-weight: 600; margin-bottom: .35rem; }
  .pg-bar { position: relative; height: 1.3rem; background: var(--inset); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: .45rem; }
  .pg-fill { height: 100%; background: #7d2d1e; transition: width .3s ease; }
  .pg-hp { position: absolute; inset: 0; display: grid; place-items: center; font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pg-pools { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .45rem; }
  .pg-pools .p { font-size: .7rem; background: var(--inset); color: var(--info); border-radius: var(--pill); padding: .1rem .45rem; }
  .pg-pools .p.empty-pool { color: var(--text-dim); text-decoration: line-through; }

  /* Modal specific styles */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .4rem; margin-bottom: 1rem; }
  .stat-cell { display: flex; align-items: center; gap: .35rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: .3rem .45rem; }
  .stat-cell .s-label { flex: 1; font-size: .78rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-cell .s-val { width: 3.4rem; text-align: center; font-variant-numeric: tabular-nums; }
  .stat-cell.extra { border-left: 2px solid var(--gold); }

  .f-row { display: flex; align-items: center; gap: .35rem; padding: .3rem 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .f-row .f-name { flex: 1 1 11rem; min-width: 8rem; }
  .f-row .costs { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; }
  .cost-chip { display: inline-flex; align-items: center; gap: .2rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: .12rem .2rem; }
  .cost-chip.orphan { background: rgba(139, 30, 63, .3); }
  .cost-chip .f-cost { width: 8.5rem; }
  .cost-chip .f-amount { width: 2.9rem; text-align: center; }
  .add-cost { background: none; color: var(--text-dim); font-size: .72rem; padding: .15rem .35rem; cursor: pointer; border: none; }
  .add-cost:hover { color: var(--gold); }
  .f-row .f-uses { flex: 0 0 3.6rem; text-align: center; }
  .f-row .f-recharge { flex: 0 0 8rem; }
  .f-row .f-roll { flex: 0 0 7rem; font-family: ui-monospace, Consolas, monospace; color: var(--gold); }
  .f-row .f-roll::placeholder { color: var(--text-dim); font-family: var(--font); }
  .f-row.orphan { background: rgba(139, 30, 63, .14); border-radius: var(--radius-sm); }
  .f-row .more { background: none; color: var(--text-muted); padding: .2rem .45rem; cursor: pointer; border: none; }
  .f-extra { padding: .3rem 0 .6rem 0; display: flex; flex-direction: column; gap: .4rem; }
  .f-extra .fx-row { display: flex; gap: .35rem; align-items: center; }

  .hint { font-size: .72rem; color: var(--text-dim); }
  .saved { color: var(--ok); margin-left: 1rem; }

  /* Rolls sidebar */
  .rolls { background: var(--surface); border-radius: var(--radius-lg); padding: var(--pad-card); }
  .roll-row { border-top: 1px solid var(--border); padding: .5rem .1rem; display: grid; grid-template-columns: 1fr auto; gap: .15rem .6rem; }
  .roll-row:first-of-type { border-top: 0; }
  .roll-who { font-weight: 600; font-size: .85rem; }
  .roll-what { font-size: .72rem; color: var(--text-muted); }
  .roll-total { grid-row: 1 / 3; align-self: center; font-family: var(--font-display); font-size: 1.7rem; color: var(--gold); font-variant-numeric: tabular-nums; }
  .roll-detail { grid-column: 1 / -1; font-family: ui-monospace, Consolas, monospace; font-size: .68rem; color: var(--text-dim); }
  .roll-row.fresh { animation: flash 1.2s ease; }
  @keyframes flash { from { background: color-mix(in srgb, var(--gold) 22%, transparent); } to { background: transparent; } }
  .roll-free { color: var(--text-dim); font-size: .68rem; }
  /* Esito e ruoli dei dadi (Duality di Daggerheart): Speranza in oro, Paura nel
     vino dell'accento, il critico marcato pieno. Su un tiro normale non c'è
     esito e questi non compaiono. */
  .roll-outcome { display: inline-block; margin-left: .35rem; padding: .02rem .35rem; border-radius: var(--pill); font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; vertical-align: middle; }
  .oc-hope { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); }
  .oc-fear { background: color-mix(in srgb, var(--accent) 30%, transparent); color: #e8869f; }
  .oc-crit { background: var(--gold); color: #201700; }
  .roll-detail .die-hope { color: var(--gold); }
  .roll-detail .die-fear { color: #e8869f; }

  .hp-editor { display: flex; gap: .3rem; align-items: center; margin-bottom: 1rem; }
  .hp-editor input { flex: 0 0 4rem; text-align: center; padding: .3rem; }
  .hp-editor button { flex: 1; padding: .3rem; font-size: .85rem; max-width: 6rem; }
  .hp-editor .heal { background: var(--ok); color: #14161c; }
</style>
</head>
<body>
<header></header>
<main class="session">
  <div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
      <h2 style="margin: 0;">Sessione Attiva</h2>
      <button class="secondary" onclick="document.getElementById('qr-modal-overlay').style.display='flex'">Mostra QR Invito</button>
    </div>

    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem;">
        <h2 class="section-title" style="margin:0"><i class="ra ra-heart-tower"></i>Al tavolo</h2>
        <div style="display: flex; gap: .5rem;">
          <input id="new-name" placeholder="Nome giocatore" style="max-width: 10rem;">
          <button id="new-pg-btn" class="secondary">+ Aggiungi</button>
        </div>
      </div>
      <div id="pgs" class="pgs"></div>
    </section>

    <section class="initiative-panel">
      <h2 class="section-title"><i class="ra ra-swords"></i> Iniziativa</h2>
      <!-- Due punti d'ingresso, una lista sola. Giocatori e bestie vengono da
           due posti diversi (il tavolo e il bestiario) e si aggiungono in due
           momenti diversi: mescolarli in un menù unico obbligava a cercare la
           bestia in mezzo ai PG ogni volta. -->
      <div class="init-add">
        <div class="init-add-row">
          <i class="ra ra-player" aria-hidden="true"></i>
          <select id="init-add-pg" aria-label="Giocatore da aggiungere"></select>
          <input id="init-num-pg" class="init-num" type="number" inputmode="numeric"
                 placeholder="—" aria-label="Iniziativa del giocatore">
          <button class="secondary" onclick="addInitiative('pc')">Aggiungi</button>
        </div>
        <div class="init-add-row">
          <i class="ra ra-monster-skull" aria-hidden="true"></i>
          <select id="init-add-npc" aria-label="Bestia da aggiungere"></select>
          <input id="init-num-npc" class="init-num" type="number" inputmode="numeric"
                 placeholder="—" aria-label="Iniziativa della bestia">
          <button class="secondary" onclick="addInitiative('monster')">Aggiungi</button>
        </div>
      </div>
      <div id="init-list" class="init-list"><p class="empty">Nessuno nell'iniziativa.</p></div>
      <div class="init-controls">
        <button onclick="nextTurn()" style="flex: 1;"><i class="ra ra-cycle"></i> Prossimo Turno</button>
        <button class="danger" onclick="clearInitiative()">Pulisci</button>
      </div>
    </section>
  </div>

  <aside class="rolls">
    <h2 class="section-title"><i class="ra ra-perspective-dice-six"></i>Tiri</h2>
    <div id="roll-list"><p class="empty">Nessun tiro ancora.</p></div>
  </aside>
</main>

<div class="overlay" id="qr-modal-overlay" style="display:none" onclick="if(event.target.id==='qr-modal-overlay') this.style.display='none'">
  <div class="qr-modal">
    <img id="qr" src="/api/admin/qr.png" alt="QR per unirsi">
    <div class="join-url" id="join-url-big">—</div>
    <p style="color: var(--text-muted); font-size: .9rem; max-width: 30ch; margin-top: .5rem;">
      I giocatori possono inquadrare questo QR per unirsi alla partita.
    </p>
    <button class="secondary" style="margin-top: 1.5rem;" onclick="document.getElementById('qr-modal-overlay').style.display='none'">Chiudi</button>
  </div>
</div>

<script type="module">
import { mountHeader, mountConfirm, confirmAction, api, getState, esc, isOrphanCost, hasOrphanCost, makeRenderGuard } from './assets/console.js';

mountHeader('index.html');
mountConfirm();

let state = null;
let monsters = [];

const profile = () => state?.profile;
const P = id => state?.characters.find(c => c.id === id);
const F = (cid, fid) => P(cid)?.features.find(f => f.id === fid);

// ---- API Chiamate e Aggiornamenti ----
const flash = () => {
  const el = document.getElementById('saved');
  if(el) {
    el.textContent = 'salvato';
    setTimeout(() => { el.textContent = ''; }, 1200);
  }
};

window.changeHp = async (id, sign) => {
  const amt = Math.max(1, Math.trunc(Number(document.getElementById(`hp-amt-${id}`)?.value) || 1));
  await api('POST', `/api/characters/${id}/hp`, { delta: sign * amt });
  refresh(true);
};

// ---- Rendering Principale (Lista) ----
const guard = makeRenderGuard();

const poolChips = c => Object.values(c.pools).flatMap(pool =>
  Object.entries(pool.tiers).map(([lv, s]) => {
    const label = pool.kind === 'Leveled' ? `${pool.label} L${lv}` : pool.label;
    return `<span class="p ${s.remaining === 0 ? 'empty-pool' : ''}">${esc(label)} ${s.remaining}/${s.max}</span>`;
  })).join('');

function renderList() {
  if (!state) return;
  const view = state.characters.map(c => ({ id: c.id, name: c.name, hp: c.hp, pools: c.pools }));
  if (!guard(view)) return;

  document.getElementById('pgs').innerHTML = state.characters.map(c => `
    <div class="pg" onclick="window.location.href='/#edit/' + encodeURIComponent('${c.id}')">
      <div class="pg-name">${esc(c.name)}</div>
      <div class="pg-bar">
        <div class="pg-fill" style="width:${c.hp.max ? (100 * c.hp.current / c.hp.max) : 0}%"></div>
        <span class="pg-hp">PF ${c.hp.current}/${c.hp.max}</span>
      </div>
      <div class="hp-editor" style="margin-top: .5rem;" onclick="event.stopPropagation()">
        <input id="hp-amt-${c.id}" type="number" min="1" value="1" onclick="event.stopPropagation()">
        <button onclick="changeHp('${c.id}',-1); event.stopPropagation()">Danno</button>
        <button class="heal" onclick="changeHp('${c.id}',1); event.stopPropagation()">Cura</button>
      </div>
      ${poolChips(c) ? `<div class="pg-pools">${poolChips(c)}</div>` : ''}
    </div>`).join('')
    || '<p class="empty">Nessun personaggio.</p>';
}

async function refresh(forceModal = false) {
  state = await getState();
  try {
    monsters = await fetch('/api/admin/monsters').then(r => r.json());
  } catch(e){}
  renderList();
  renderInitiative();
}

// ---- Iniziativa ----

/** Le voci correnti, nella forma che la rotta si aspetta. */
const initEntries = () => (state.initiative?.order || [])
  .map(e => ({ refId: e.refId, kind: e.kind, name: e.name, initiative: e.initiative }));

window.addInitiative = async (kind) => {
  const sel = document.getElementById(kind === 'pc' ? 'init-add-pg' : 'init-add-npc');
  const num = document.getElementById(kind === 'pc' ? 'init-num-pg' : 'init-num-npc');
  if (!sel.value) return;

  const source = kind === 'pc' ? state.characters : monsters;
  const found = source.find(x => x.id === sel.value);
  if (!found) return;

  const order = [...initEntries(), {
    refId: found.id,
    kind,
    name: found.name,
    // Campo vuoto = 0: al tavolo capita di aggiungere prima e tirare dopo, e
    // uno zero in fondo alla lista è meglio di un rifiuto.
    initiative: Number(num.value) || 0,
  }];

  await api('POST', '/api/admin/initiative', { order, activeId: state.initiative?.activeId });
  num.value = '';
  refresh();
};

window.removeInitiative = async (refId) => {
  const order = initEntries().filter(e => e.refId !== refId);
  // L'activeId lo ripulisce il server se non è più in lista: qui non si
  // duplica la regola.
  await api('POST', '/api/admin/initiative', { order, activeId: state.initiative?.activeId });
  refresh();
};

window.nextTurn = async () => {
  await api('POST', '/api/admin/initiative/next', {});
  refresh();
};

window.clearInitiative = async () => {
  confirmAction("Svuotare l'iniziativa?", async () => {
    await api('POST', '/api/admin/initiative', { order: [], activeId: null });
    refresh();
  });
};

/** Riempie una tendina, conservando la scelta in corso durante il poll. */
function fillPicker(id, entities, vuoto, giaDentro) {
  const sel = document.getElementById(id);
  const prima = sel.value;
  const liberi = entities.filter(e => !giaDentro.has(e.id));

  sel.innerHTML = `<option value="">${vuoto}</option>`
    + liberi.map(e => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');

  if (prima && liberi.some(e => e.id === prima)) sel.value = prima;
  sel.disabled = liberi.length === 0;
}

function renderInitiative() {
  if (!state) return;

  const order = state.initiative?.order || [];
  const activeId = state.initiative?.activeId;
  // Chi è già nel giro sparisce dalle tendine: aggiungerlo due volte non vuol
  // dire niente, e vederselo proporre fa dubitare di averlo aggiunto.
  const giaDentro = new Set(order.map(e => e.refId));

  fillPicker('init-add-pg', state.characters, 'Giocatore…', giaDentro);
  fillPicker('init-add-npc', monsters, monsters.length ? 'Bestia…' : 'Bestiario vuoto', giaDentro);

  const list = document.getElementById('init-list');
  if (!order.length) {
    list.innerHTML = '<p class="empty">Nessuno nell\'iniziativa.</p>';
    return;
  }

  // L'ordine è già quello giusto: lo decide il server.
  list.innerHTML = order.map(e => {
    const isActive = activeId === e.refId;
    return `
      <div class="init-row ${isActive ? 'active' : ''} ${e.kind === 'monster' ? 'npc' : ''}">
        <span class="init-score">${e.initiative}</span>
        <span class="init-name">${isActive ? '▶ ' : ''}<strong>${esc(e.name)}</strong></span>
        <button class="ghost" style="padding: 0 .4rem;" onclick="removeInitiative('${esc(e.refId)}')">✕</button>
      </div>`;
  }).join('');
}

// ---- Tiri ----
const seen = new Set();

// Etichette italiane per gli esiti categorici (Duality di Daggerheart). La
// chiave grezza arriva dal server; qui diventa parola.
const OUTCOME_LABEL = { hope: 'Speranza', fear: 'Paura', crit: 'Critico' };

// Un dado con l'eventuale ruolo: la classe lo colora, il valore resta un numero.
function dieHtml(d) {
  const cls = d.role ? ` die-${d.role}` : '';
  return `<span class="die${cls}">d${d.sides}:${d.value}</span>`;
}

function renderRoll(roll, fresh) {
  if (seen.has(roll.id)) return;
  seen.add(roll.id);

  const list = document.getElementById('roll-list');
  if (seen.size === 1) list.innerHTML = '';

  const kept = roll.attempts[roll.keptIndex];
  const dice = kept.dice.map(dieHtml).join(' ');
  const mod = kept.modifier ? ` ${kept.modifier > 0 ? '+' : '−'} ${Math.abs(kept.modifier)}` : '';
  const discarded = roll.attempts.length > 1
    ? ` · scartato ${roll.attempts.filter((_, i) => i !== roll.keptIndex).map(a => a.total).join(', ')}`
    : '';
  const outcome = roll.outcome
    ? ` <span class="roll-outcome oc-${roll.outcome}">${OUTCOME_LABEL[roll.outcome] || esc(roll.outcome)}</span>`
    : '';

  const row = document.createElement('div');
  row.className = 'roll-row' + (fresh ? ' fresh' : '');
  row.innerHTML = `
    <span class="roll-who">${esc(roll.characterName)}</span>
    <span class="roll-total">${roll.total}</span>
    <span class="roll-what">${esc(roll.label)}${outcome}${roll.spent ? '' : ' <span class="roll-free">(free)</span>'}</span>
    <span class="roll-detail">${esc(roll.formula)} → ${dice}${mod}${discarded}</span>`;
  list.prepend(row);

  while (list.children.length > 30) list.lastChild.remove();
}

function listenRolls() {
  const source = new EventSource('/api/admin/rolls/stream');
  let primed = false;
  source.onmessage = e => renderRoll(JSON.parse(e.data), primed);
  setTimeout(() => { primed = true; }, 1000);
  source.onerror = () => {};
}

// Avvio
fetch('/api/admin/join-info').then(r => r.json()).then(i => { document.getElementById('join-url-big').textContent = i.url; }).catch(() => {});
refresh(true);
listenRolls();
setInterval(() => refresh(false), 3000);
</script>
</body>
</html>
